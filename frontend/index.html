<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部门管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@0.27.2/dist/axios.min.js"></script>
</head>
<body>
<div id="app" v-cloak>
    <!-- 顶部标题栏 -->
    <el-page-header @back="goBack" content="部门管理"></el-page-header>

    <div class="container">
        <!-- 新增按钮 -->
        <div class="toolbar">
            <el-button type="primary" icon="el-icon-plus" @click="dialogVisible = true">新增部门</el-button>
        </div>

        <!-- 部门列表 -->
        <el-table :data="deptList" border stripe style="width: 100%">
            <el-table-column prop="id" label="ID" width="80"></el-table-column>
            <el-table-column prop="name" label="部门名称"></el-table-column>
            <el-table-column prop="createTime" label="创建时间" width="180"></el-table-column>
            <el-table-column prop="updateTime" label="更新时间" width="180"></el-table-column>
            <el-table-column label="操作" width="150">
                <template slot-scope="scope">
                    <el-button type="danger" size="mini" icon="el-icon-delete" @click="deleteDept(scope.row)">删除</el-button>
                </template>
            </el-table-column>
        </el-table>

        <!-- 空数据提示 -->
        <el-empty v-if="deptList.length === 0" description="暂无部门数据"></el-empty>
    </div>

    <!-- 新增部门弹窗 -->
    <el-dialog title="新增部门" :visible.sync="dialogVisible" width="400px" @closed="resetForm">
        <el-form ref="addForm" :model="addForm" :rules="addRules" label-width="80px">
            <el-form-item label="部门名称" prop="name">
                <el-input v-model="addForm.name" placeholder="请输入部门名称"></el-input>
            </el-form-item>
        </el-form>
        <span slot="footer" class="dialog-footer">
            <el-button @click="dialogVisible = false">取 消</el-button>
            <el-button type="primary" @click="addDept">确 定</el-button>
        </span>
    </el-dialog>
</div>

<script src="js/app.js"></script>
</body>
</html>
